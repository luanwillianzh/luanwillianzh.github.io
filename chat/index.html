<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Kindle AI Chat</title>

<style>
body {
    font-family: sans-serif;
    margin: 10px;
}

#chat {
    border: 1px solid #000;
    height: 320px;
    overflow: auto;
    padding: 5px;
    white-space: pre-wrap;
    margin-bottom: 10px;
}

textarea {
    width: 100%;
    height: 60px;
}

button {
    width: 100%;
    height: 40px;
    margin-top: 5px;
}
</style>
</head>

<body>

<div id="chat"></div>

<textarea id="msg"></textarea>

<button onclick="sendMsg()">Send</button>
<button onclick="clearChat()">Clear Memory</button>

<script>
var API_URL = "https://hermes.ai.unturf.com/v1/chat/completions";
var API_KEY = "YOUR_API_KEY";

/*
Persistent conversation memory
*/
var messages = [
    {
        role: "system",
        content: "You are a helpful assistant."
    }
];

/*
Load saved conversation
*/
try {

    var saved =
        localStorage.getItem("chat_memory");

    if (saved) {
        messages = JSON.parse(saved);
    }

} catch (e) {
}

/*
Render messages
*/
function renderAll() {

    var chat =
        document.getElementById("chat");

    chat.innerHTML = "";

    for (var i = 0; i < messages.length; i++) {

        var m = messages[i];

        if (m.role == "user") {
            add("You: " + m.content);
        }

        if (m.role == "assistant") {
            add("AI: " + m.content);
        }
    }
}

/*
Add text to screen
*/
function add(text) {

    var chat =
        document.getElementById("chat");

    chat.innerHTML += text + "\n\n";

    chat.scrollTop =
        chat.scrollHeight;
}

/*
Save memory
*/
function saveMemory() {

    try {

        localStorage.setItem(
            "chat_memory",
            JSON.stringify(messages)
        );

    } catch (e) {
    }
}

/*
Clear conversation
*/
function clearChat() {

    messages = [
        {
            role: "system",
            content: "You are a helpful assistant."
        }
    ];

    saveMemory();

    renderAll();
}

/*
Limit history size
*/
function trimMessages() {

    /*
    Keep system prompt
    Remove oldest pairs
    */

    while (messages.length > 12) {

        messages.splice(1, 2);
    }
}

/*
Send message
*/
function sendMsg() {

    var box =
        document.getElementById("msg");

    var text = box.value;

    if (!text) {
        return;
    }

    box.value = "";

    /*
    Save user message
    */
    messages.push({
        role: "user",
        content: text
    });

    trimMessages();

    saveMemory();

    add("You: " + text);

    var xhr = new XMLHttpRequest();

    xhr.open(
        "POST",
        API_URL,
        true
    );

    xhr.setRequestHeader(
        "Content-Type",
        "application/json"
    );

    xhr.setRequestHeader(
        "Authorization",
        "Bearer " + API_KEY
    );

    xhr.onreadystatechange = function() {

        if (xhr.readyState == 4) {

            if (xhr.status == 200) {

                try {

                    var res =
                        JSON.parse(
                            xhr.responseText
                        );

                    var reply =
                        res.choices[0]
                        .message.content;

                    /*
                    Save assistant reply
                    */
                    messages.push({
                        role: "assistant",
                        content: reply
                    });

                    trimMessages();

                    saveMemory();

                    add("AI: " + reply);

                } catch (e) {

                    add("Parse error");
                }

            } else {

                add(
                    "HTTP Error: " +
                    xhr.status
                );
            }
        }
    };

    var data = {

        model: "adamo1139/Hermes-3-Llama-3.1-8B-FP8-Dynamic",

        messages: messages
    };

    xhr.send(
        JSON.stringify(data)
    );
}

/*
Show old conversation on load
*/
renderAll();
</script>

</body>
</html>
